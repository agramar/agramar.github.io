<!DOCTYPE html>
<html lang="ko" data-theme="">

  {% include head.html %}

  <body>

    <!-- 스크롤 진행 표시바 -->
    <div id="scroll-progress" style="position:fixed;top:0;left:0;height:3px;background:var(--color-progress-bar);width:0;z-index:9999;transition:width .1s linear;"></div>

    {% include sidebar.html %}

    <!-- Wrap is the content to shift when toggling the sidebar. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container" style="position:relative;">
          <h3 class="masthead-title">
            <a href="{{ site.baseurl }}/" title="{{ site.title }}">
              <img class="masthead-logo" src="{{ site.baseurl }}{{ site.logo }}" alt="{{ site.title }}"/>
            </a>
            <small>{{ site.tagline }}</small>
          </h3>
          <!-- 다크모드 토글 버튼 -->
          <button class="theme-toggle" id="theme-toggle" aria-label="다크모드 전환" title="다크모드 전환">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
          </button>
        </div>
      </div>

      <div class="container content">
        {{ content }}
      </div>
    </div>

    <!-- 사이드바 토글 레이블 -->
    <label for="sidebar-checkbox" class="sidebar-toggle">
      <span></span>
    </label>

    <!-- 상단으로 이동 버튼 -->
    <button id="back-to-top" aria-label="상단으로 이동" title="상단으로 이동"
      style="
        position:fixed;
        bottom:1.5rem;
        right:1.5rem;
        width:2.5rem;
        height:2.5rem;
        border-radius:50%;
        border:none;
        background:var(--color-link);
        color:#fff;
        cursor:pointer;
        display:none;
        align-items:center;
        justify-content:center;
        font-size:1rem;
        box-shadow:0 2px 12px var(--color-shadow);
        z-index:200;
        transition:all .2s ease;
        opacity:0;
      ">
      <i class="fa-solid fa-chevron-up"></i>
    </button>

    <script>
    (function() {
      /* ── 사이드바 토글 ── */
      var toggle = document.querySelector('.sidebar-toggle');
      var sidebar = document.querySelector('#sidebar');
      var checkbox = document.querySelector('#sidebar-checkbox');

      document.addEventListener('click', function(e) {
        var target = e.target;
        if (toggle && toggle.contains(target)) {
          checkbox.checked = !checkbox.checked;
          e.preventDefault();
        } else if (checkbox && checkbox.checked && sidebar && !sidebar.contains(target)) {
          checkbox.checked = false;
        }
      }, false);

      /* ── 다크모드 토글 ── */
      var themeToggle = document.getElementById('theme-toggle');
      var themeIcon   = document.getElementById('theme-icon');
      var html        = document.documentElement;

      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'dark') {
          themeIcon.className = 'fa-solid fa-sun';
        } else {
          themeIcon.className = 'fa-solid fa-moon';
        }
      }

      // 초기 상태 아이콘 설정
      var currentTheme = html.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        themeIcon.className = 'fa-solid fa-sun';
      }

      if (themeToggle) {
        themeToggle.addEventListener('click', function() {
          var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
        });
      }

      /* ── 스크롤 진행바 ── */
      var progressBar = document.getElementById('scroll-progress');
      function updateProgress() {
        var docH   = document.documentElement.scrollHeight - window.innerHeight;
        var scrolled = docH > 0 ? (window.scrollY / docH * 100) : 0;
        progressBar.style.width = scrolled + '%';
      }

      /* ── 상단 이동 버튼 ── */
      var backToTop = document.getElementById('back-to-top');
      function handleScroll() {
        updateProgress();
        if (window.scrollY > 300) {
          backToTop.style.display = 'flex';
          backToTop.style.opacity = '1';
        } else {
          backToTop.style.opacity = '0';
          setTimeout(function() {
            if (window.scrollY <= 300) backToTop.style.display = 'none';
          }, 200);
        }
      }

      window.addEventListener('scroll', handleScroll, { passive: true });

      if (backToTop) {
        backToTop.addEventListener('click', function() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        backToTop.addEventListener('mouseenter', function() {
          this.style.transform = 'translateY(-3px)';
          this.style.boxShadow = '0 4px 16px var(--color-shadow)';
        });
        backToTop.addEventListener('mouseleave', function() {
          this.style.transform = '';
          this.style.boxShadow = '0 2px 12px var(--color-shadow)';
        });
      }
    })();
    </script>

    {% if site.google_analytics_token %}
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_token }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics_token }}');
    </script>
    {% endif %}

  </body>
  {% if site.disqus_short_name %}
  <script id="dsq-count-scr" src="//{{ site.disqus_short_name }}.disqus.com/count.js" async></script>
  {% endif %}
</html>
